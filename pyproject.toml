[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volati-elite"
version = "0.4.10"
description = "A local-first guided memory forensics workbench powered by Volatility 3"
requires-python = ">=3.11"
dependencies = ["volatility3[full]==2.28.2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "ijson>=3.3,<4", "psutil>=7,<8", "PySide6==6.12.0"]
license = {text = "Volatility Software License 1.0"}

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
volati-elite = "volstudio.__main__:main"

[tool.setuptools.packages.find]
include = ["volstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

